version: '3.8'

services:
  skintime:
    build:
      context: .
      dockerfile: SkinTime/Dockerfile 
    depends_on:
      - mysql
      - redis
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__DefaultConnectionMySQL=Server=mysql;Port=3306;Database=skintime;User=root;Password=root;
      - Redis__Host=redis
    ports:
      - "8080:8080"
      - "8081:8081"
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: skintime_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skintime
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d 
    ports:
      - "3306:3306"
    networks:
      - app_network

  redis:
    image: redis:latest
    container_name: skintime_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data:
